<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Skill</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>


<div class="container">


<h1>Add New Skill</h1>


<form action="/add-skill" method="post">


<input type="text"
name="name"
placeholder="Skill Name"
required>


<br><br>


<textarea
name="description"
placeholder="Skill Description">
</textarea>


<br><br>


<input type="text"
name="level"
placeholder="Skill Level (Beginner/Intermediate/Advanced)"
required>


<br><br>


<button type="submit">
Add Skill
</button>


</form>


</div>


</body>

</html>
