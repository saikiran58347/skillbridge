<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Bookings</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h1>My Bookings</h1>


    <!-- No bookings -->

    <div th:if="${#lists.isEmpty(bookings)}">

        <p>You have no bookings yet.</p>

    </div>


    <!-- Display bookings -->

    <div th:each="booking : ${bookings}">

        <h2 th:text="${booking.skill.name}"></h2>


        <p>
            Teacher:
            <span th:text="${booking.skill.user.fullName}"></span>
        </p>


        <p>
            Status:
            <span th:text="${booking.status}"></span>
        </p>


        <!-- Show date and time when scheduled -->

        <div th:if="${booking.bookingDate != null}">

            <p>
                Date:
                <span th:text="${booking.bookingDate}"></span>
            </p>

        </div>


        <div th:if="${booking.bookingTime != null}">

            <p>
                Time:
                <span th:text="${booking.bookingTime}"></span>
            </p>

        </div>


        <!-- Waiting message -->

        <div th:if="${booking.status == 'Pending'}">

            <p>
                Waiting for teacher approval...
            </p>

        </div>


        <!-- Rejected message -->

        <div th:if="${booking.status == 'Rejected'}">

            <p>
                This booking request was rejected.
            </p>

        </div>


        <hr>

    </div>


    <a href="/dashboard">
        Back to Dashboard
    </a>

</div>

</body>

</html>
